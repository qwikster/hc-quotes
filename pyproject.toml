[project]
name = "quotes"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "pydantic-settings",
    "jinja2",
    "httpx",
    "pyjwt",
    "cryptography"
]

[project.scripts]
hc-quotes = "quotes.main:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quotes"]
