<!DOCTYPE html>
<HTML>
	<HEAD>
		<TITLE>HC Quotes | Submit</TITLE>
		<META NAME="viewport" CONTENT="width=device-width, initial-width=1">
		<LINK REL="stylesheet" HREF="/css/style.css">
		<LINK REL="stylesheet" HREF="/css/new.css">
	</HEAD>

	<BODY>
	    <div class="panel">
    		<H1>Submit Quote</H1>
    		<FORM class="new" ACTION="/create" METHOD="POST">
    		    <div class="form-area">
    				<span class="form-label">author:</span>
    				<INPUT class="textform" NAME="author" ID="author" PLACEHOLDER="zrl">
    			</div>
    			<div class="form-area">
                    <span class="form-label">quote:</span>
        			<TEXTAREA class="textform textform-long" NAME="quote" PLACEHOLDER="I want to cheese"></TEXTAREA>
                </div>
     			<BUTTON class="submit" TYPE="submit">submit!</BUTTON>
    		</FORM>
		</div>
		<p class="note"><I>please remember to follow the <b>code of conduct</b> &lt;3</I></p>
		<p class="note"><I>made in 2026 w/ &lt;3 by HC'ers (not an HQ project)</I></p>
	</BODY>
</HTML>
