<!doctype html>
<html>
    <head>
        <title>hc quotes</title>
        <meta name="viewport" content="width=device-width, initial-width=1" />
        <link rel="stylesheet" href="/css/style.css" />
    </head>
    <body>
        <div class="head">
            <h1>
                <img src="https://assets.hackclub.com/icon-rounded.svg", width="26rem">
                &nbsp;Hack Club Quotes</h1>
            <a id="login-button-link" href="/new"><button class="login">New Quote!!</button></a>
        </div>
	<DIV CLASS="search-part">
		<INPUT class="search sbar" ID="search-bar" PLACEHOLDER="search ->">
		<SELECT class="search ssel" ID="search-mode-select">
			<OPTION VALUE="top">votes: top</OPTION>
			<OPTION VALUE="bottom">votes: low</OPTION>
			<OPTION VALUE="new" selected>time: new</OPTION>
			<OPTION VALUE="old">time: old</OPTION>
			<OPTION VALUE="random">random</OPTION>
			<OPTION VALUE="alphabet">A -> Z</OPTION>
		</SELECT>
		<BUTTON class="search sbut" ID="search-button" ONCLICK="Search(0)">Search!</BUTTON>
	</DIV>
	<div class="panel homep" id = "quotes-all">
            <!-- elements added here with js -->
        </div>
	<div CLASS="page-switchy-things">
		<BUTTON CLASS="switchy" ID="button-left" ONCLICK="page(-1)">⇐</BUTTON>
		<SPAN ID="page-num">0</SPAN>
		<BUTTON CLASS="switchy" ID="button-right" ONCLICK="page(1)">⇒</BUTTON>
	</div>
    </body>
    <script src="/js/script.js"></script>
    <script>
        add_random_quotes(30);
	replaceLoginButtonIfNeeded();
    </script>
</html>
