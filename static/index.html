<!doctype html>
<html>
    <head>
        <title>hc quotes</title>
        <meta name="viewport" content="width=device-width, initial-width=1" />
        <link rel="stylesheet" href="/css/style.css" />
    </head>
    <body>
        <div class="head">
            <h1>
                <img src="https://assets.hackclub.com/icon-rounded.svg", width="26rem">
                &nbsp;Hack Club Quotes</h1>
            <a id="login-button-link" href="/new"><button class="login">New Quote!!</button></a>
        </div>
	<DIV CLASS="search-part">
		<SELECT ID="search-mode-select">
			<OPTION VALUE="">(choose sort mode)</OPTION>
			<OPTION VALUE="top">Top</OPTION>
			<OPTION VALUE="bottom">Bottom</OPTION>
			<OPTION VALUE="new">New</OPTION>
			<OPTION VALUE="old">Old</OPTION>
			<OPTION VALUE="random">Random</OPTION>
			<OPTION VALUE="alphabet">Alphabet</OPTION>
		</SELECT>
		<INPUT ID="search-bar" PLACEHOLDER="i want to cheese">
		<BUTTON ID="search-button" ONCLICK="Search(0)">Search!</BUTTON>
	</DIV>
	<div class="panel homep" id = "quotes-all">
            <!-- elements added here with js -->
        </div>
    </body>
    <script src="/js/script.js"></script>
    <script>
        add_random_quotes(30);
	replaceLoginButtonIfNeeded();
    </script>
</html>
